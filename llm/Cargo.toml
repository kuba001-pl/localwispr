[package]
name = "localwispr-llm"
version = "0.2.1"
edition = "2024"
description = "Out-of-process llama.cpp worker for localwispr transcript cleanup"
license = "MIT"
rust-version = "1.92"

# llama.cpp lives in its own process: whisper.cpp and llama.cpp each vendor a
# different ggml, and both cannot be linked into one binary.

[features]
default = ["cuda"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
anyhow = "1"
llama-cpp-2 = "0.1.160"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
